# الإنتاج: الكود من صورة app (بدون ربط ./ كامل). بعد سحب إصدار جديد من app أعد بناء nginx ثم up:
#   IMAGE_TAG=main docker compose -f docker-compose.prod.yml pull app
#   IMAGE_TAG=main docker compose -f docker-compose.prod.yml build nginx
#   IMAGE_TAG=main docker compose -f docker-compose.prod.yml up -d
version: "3.9"

services:
  app:
    image: ghcr.io/diinnaamrr/engezny-backend:${IMAGE_TAG:-latest}
    container_name: engezny_app_prod
    restart: unless-stopped
    working_dir: /var/www/html

    volumes:
      - ./.env:/var/www/html/.env:ro
      - storage_data:/var/www/html/storage
      - cache_data:/var/www/html/bootstrap/cache

    env_file:
      - .env

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - db
      - redis

    networks:
      - engezny-prod-network

  nginx:
    build:
      context: .
      # لا تستخدم ${APP_IMAGE} هنا — Compose يستبدله قبل البناء فيصبح FROM فاضي.
      # IMAGE_TAG يُعوَّض من البيئة أو يبقى latest.
      dockerfile_inline: |
        FROM ghcr.io/diinnaamrr/engezny-backend:${IMAGE_TAG:-latest} AS app
        FROM nginx:alpine
        COPY --from=app /var/www/html /var/www/html
    image: engezny-nginx-prod:${IMAGE_TAG:-latest}
    container_name: engezny_nginx_prod
    restart: unless-stopped
    ports:
      - "8020:80"

    volumes:
      - storage_data:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      - app

    networks:
      - engezny-prod-network

  db:
    image: mysql:8.0
    container_name: engezny_db_prod
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - engezny_dbdata_prod:/var/lib/mysql

    command: --default-authentication-plugin=mysql_native_password

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - engezny-prod-network

  # phpMyAdmin: بدون دخول تلقائي — ادخلي DB_USERNAME و DB_PASSWORD من .env في شاشة تسجيل الدخول
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: engezny_phpmyadmin_prod
    restart: unless-stopped
    ports:
      - "8045:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - db
    networks:
      - engezny-prod-network

  redis:
    image: redis:7-alpine
    container_name: engezny_redis_prod
    restart: unless-stopped

    volumes:
      - engezny_redisdata_prod:/data

    command: redis-server --appendonly yes

    networks:
      - engezny-prod-network

networks:
  engezny-prod-network:
    driver: bridge

volumes:
  engezny_dbdata_prod:
  engezny_redisdata_prod:
  storage_data:
  cache_data:
